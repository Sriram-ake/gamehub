<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GameHub</title>

  <!-- Typography Pairing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="page-wrapper" style="justify-content: center; align-items: center; min-height: calc(100vh - var(--topbar-h));">
    <div class="container container-narrow">
      <div class="glass-strong card reveal" style="padding: var(--space-8);">
        <div style="text-align: center; margin-bottom: var(--space-6);">
          <div style="font-size: 2.8rem; margin-bottom: var(--space-2);">👾</div>
          <h1 style="font-family: var(--font-display); font-size: var(--fs-xl); letter-spacing: 0.05em; margin-bottom: var(--space-2);">
            Player Sign In
          </h1>
          <p style="color: var(--text-1); font-size: var(--fs-sm);">
            Access your player profile, global ranks, and achievements
          </p>
        </div>

        <div id="form-alert" class="badge" style="display: none; width: 100%; padding: var(--space-3); background: rgba(251,113,133,0.15); border: 1px solid var(--danger); color: #fff; margin-bottom: var(--space-4); border-radius: var(--radius-sm);"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="usernameOrEmail" class="form-label">Username or Email</label>
            <input type="text" id="usernameOrEmail" name="usernameOrEmail" class="form-input" placeholder="e.g. player or player@gamehub.local" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--space-6);">
            <span id="btn-text">Sign In to GameHub</span>
            <span id="btn-spinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div style="margin-top: var(--space-6); text-align: center; border-top: 1px solid var(--glass-border); padding-top: var(--space-4);">
          <p style="color: var(--text-1); font-size: var(--fs-sm);">
            New to GameHub? <a href="/register.html" style="font-weight: 600; color: var(--secondary);">Create an Account</a>
          </p>
          <p style="margin-top: var(--space-2); font-size: var(--fs-xs); color: var(--text-2);">
            Demo account: <code>player</code> / <code>password123</code>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initNavbar } from '/js/core/navbar.js';
    import { auth } from '/js/core/auth.js';
    import { api } from '/js/core/api.js';
    import { toast } from '/js/core/toast.js';

    initNavbar();

    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('returnUrl') || '/index.html';

    if (urlParams.get('expired') === 'true') {
      toast.error('Your session expired. Please log in again.');
    }

    if (auth.isLoggedIn()) {
      window.location.href = returnUrl;
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertBox = document.getElementById('form-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      alertBox.textContent = '';

      const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const response = await api.post('/auth/login', { usernameOrEmail, password });
        auth.setSession(response);
        toast.success(`Welcome back, ${response.user.displayName || response.user.username}!`);

        // Check if there's a guest score awaiting submission
        const pendingScore = auth.getPendingScore();
        if (pendingScore) {
          toast.info('Submitting your guest score to leaderboards...');
          try {
            await api.post('/scores', pendingScore);
            auth.clearPendingScore();
          } catch {
            // Ignore if guest score fails
          }
        }

        setTimeout(() => {
          window.location.href = returnUrl;
        }, 500);
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
