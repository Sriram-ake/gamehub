# ==============================================================================
# GameHub Backend - Spring Boot Main Configuration
# B.Tech IT Minor Project
# ==============================================================================

spring.application.name=gamehub-backend
server.port=8080

# Default to 'dev' profile for zero-config local testing with H2 database.
# To connect to MySQL 8, run: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
spring.profiles.active=dev

# JSON formatting
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.indent-output=true

# Static resource handling: Also permit serving the shared frontend folder
spring.web.resources.static-locations=classpath:/static/,file:../frontend/,file:frontend/
