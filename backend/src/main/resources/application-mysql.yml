# ==============================================================================
# GameHub Backend - Production Profile (MySQL 8 Database)
# ==============================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamehub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: password
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# JWT Configuration
gamehub:
  jwt:
    secret: gamehub-super-secret-key-for-btech-it-minor-project-jwt-token-auth-2026-very-secure
    expiration-ms: 86400000 # 24 hours
