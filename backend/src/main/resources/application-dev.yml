# ==============================================================================
# GameHub Backend - Development Profile (H2 In-Memory with MySQL Compatibility)
# ==============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:gamehub_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# JWT Configuration (HMAC-SHA512 key >= 64 characters)
gamehub:
  jwt:
    secret: gamehub-super-secret-key-for-btech-it-minor-project-jwt-token-auth-2026-very-secure
    expiration-ms: 86400000 # 24 hours
